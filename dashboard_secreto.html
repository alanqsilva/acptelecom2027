                cursor: pointer;
                height: 20px;
                opacity: 60%;

                right: 0;
                top: 50%;

                width: 20px;
                box-sizing: content-box;

                border: 0;

                color: #ffffff;
                font-size: 14px;
                cursor: pointer;

                background: #4CAF50;

                display: flex;
                align-items: center;
                justify-content: center;

                border-radius: 50%;
